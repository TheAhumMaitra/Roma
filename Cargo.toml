[package]
name = "roma"
version = "0.1.0"
edition = "2024"
description = "A Catholic Bible Reader app "

[lib]
name = "roma"
path = "src/lib.rs"

[[bin]]
name = "Roma"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
libadwaita = { version = "0.9.2", features = ["v1_4", "v1_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
